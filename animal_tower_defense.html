<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動物保衛戰 - 塔防遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin: 8px 0;
            font-size: 26px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #game-container {
            width: 800px;
            background: #222;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 3px solid #4CAF50;
        }
        #header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 10px 20px;
            font-size: 16px;
            border-bottom: 2px solid #444;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }
        #canvas-wrap {
            position: relative;
            width: 800px;
            height: 400px;
            background: #2e7d32;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #388e3c;
        }
        #controls-panel {
            background: #263238;
            padding: 12px 20px;
            border-top: 2px solid #37474F;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .buttons-row {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn-summon {
            position: relative;
            background: #ffb300;
            color: #333;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow: hidden;
            min-width: 140px;
        }
        .btn-summon:hover:not(:disabled) {
            background: #ffa000;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }
        .btn-summon:disabled {
            background: #78909c;
            color: #cfd8dc;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }
        .cost {
            font-size: 12px;
            color: #d32f2f;
            margin-top: 2px;
        }
        .btn-summon:disabled .cost {
            color: #b0bec5;
        }
        /* 冷卻遮罩效果 */
        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            transition: height 0.05s linear;
        }

        /* 設定選單區 */
        .settings-row {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.25);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            gap: 15px;
        }
        .setting-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .setting-group select {
            background: #37474F;
            color: #fff;
            border: 1px solid #546E7A;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 13px;
            cursor: pointer;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h2 {
            font-size: 40px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        #overlay p {
            font-size: 16px;
            margin-bottom: 20px;
            max-width: 500px;
            line-height: 1.5;
        }
        .btn-action {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: #43A047;
        }
        .hidden {
            display: none !important;
        }
        #instructions {
            margin-top: 12px;
            font-size: 12px;
            color: #cfd8dc;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>🐾 動物保衛戰 🐾</h1>

    <div id="game-container">
        <!-- 上方資訊欄 -->
        <div id="header-bar">
            <div class="info-item">🛡️ 回合: <span id="ui-wave">1</span> / 10</div>
            <div class="info-item">🍖 飼料: <span id="ui-food">2</span></div>
            <div class="info-item">📊 狀態: <span id="ui-status">準備開始</span></div>
        </div>

        <!-- 遊戲畫布容器 -->
        <div id="canvas-wrap">
            <canvas id="gameCanvas" width="800" height="400"></canvas>

            <!-- 覆蓋層 -->
            <div id="overlay">
                <h2 id="overlay-title">動物保衛戰</h2>
                <p id="overlay-desc">猴子大軍企圖搶走食物！<br>召喚兔子產資源，獅子發射子彈。<br>可自訂產出與攻擊間隔（支援 0.5 秒起跳）與召喚冷卻時間！</p>
                <button id="overlay-btn" class="btn-action" onclick="startGame()">開始遊戲</button>
            </div>
        </div>

        <!-- 控制與設定面板 -->
        <div id="controls-panel">
            <!-- 設定選單 -->
            <div class="settings-row">
                <div class="setting-group">
                    <label for="select-rabbit-interval">🐰 兔子產資源:</label>
                    <select id="select-rabbit-interval">
                        <option value="0.5">0.5 秒</option>
                        <option value="1.0">1.0 秒</option>
                        <option value="1.5" selected>1.5 秒</option>
                        <option value="2.0">2.0 秒</option>
                        <option value="3.0">3.0 秒</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="select-lion-interval">🦁 獅子攻擊:</label>
                    <select id="select-lion-interval">
                        <option value="0.5">0.5 秒</option>
                        <option value="1.0" selected>1.0 秒</option>
                        <option value="1.5">1.5 秒</option>
                        <option value="2.0">2.0 秒</option>
                        <option value="3.0">3.0 秒</option>
                    </select>
                </div>
            </div>

            <!-- 召喚按鈕 -->
            <div class="buttons-row">
                <button id="btn-rabbit" class="btn-summon" onclick="summonUnit('rabbit')" disabled>
                    <span>🐰 召喚兔子</span>
                    <span class="cost">消耗: 1 🍖</span>
                    <div id="cd-rabbit" class="cooldown-overlay" style="height: 0%;"></div>
                </button>
                <button id="btn-lion" class="btn-summon" onclick="summonUnit('lion')" disabled>
                    <span>🦁 召喚獅子</span>
                    <span class="cost">消耗: 2 🍖</span>
                    <div id="cd-lion" class="cooldown-overlay" style="height: 0%;"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="instructions">
        💡 <b>更新說明</b>：召喚動物現在有冷卻時間；兔子產資源間隔與獅子攻擊間隔可透過下方選單隨時調整（以 0.5 秒為單位遞增）。
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲常數
        const ROWS = 4;
        const ROW_HEIGHT = canvas.height / ROWS;
        const COLS = 8;
        const COL_WIDTH = (canvas.width - 120) / COLS;

        // 遊戲狀態
        let gameState = 'START'; 
        let foodCount = 2;
        let currentWave = 1;

        // 陣列管理
        let grid = []; 
        let units = []; 
        let monkeys = []; 
        let projectiles = []; 
        let particles = []; 

        // 冷卻時間管理 (單位: 影格, 60fps -> 1.5秒 = 90影格)
        const COOLDOWN_MAX = 90; 
        let rabbitCooldown = 0;
        let lionCooldown = 0;

        // 10個回合配置
        const waveConfigs = [
            { count: 3, interval: 140, speed: 0.9 },   // Wave 1
            { count: 5, interval: 130, speed: 1.0 },   // Wave 2
            { count: 7, interval: 120, speed: 1.1 },   // Wave 3
            { count: 9, interval: 110, speed: 1.2 },   // Wave 4
            { count: 11, interval: 100, speed: 1.3 },  // Wave 5
            { count: 13, interval: 95, speed: 1.4 },   // Wave 6
            { count: 15, interval: 90, speed: 1.5 },   // Wave 7
            { count: 18, interval: 85, speed: 1.6 },   // Wave 8
            { count: 21, interval: 80, speed: 1.7 },   // Wave 9
            { count: 25, interval: 75, speed: 1.9 }    // Wave 10
        ];

        let currentWaveSpawnLeft = 0;
        let spawnCounter = 0;
        let wavePauseTimer = 0;
        let selectedType = null;

        function initGrid() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = null;
                }
            }
        }

        function startGame() {
            foodCount = 2;
            currentWave = 1;
            units = [];
            monkeys = [];
            projectiles = [];
            particles = [];
            rabbitCooldown = 0;
            lionCooldown = 0;
            initGrid();
            
            gameState = 'PLAYING';
            startWave(currentWave);
            
            document.getElementById('overlay').classList.add('hidden');
            updateUI();
        }

        function startWave(waveNum) {
            currentWave = waveNum;
            currentWaveSpawnLeft = waveConfigs[waveNum - 1].count;
            spawnCounter = 0;
            updateStatus(`第 ${waveNum} 回合防守中...`);
        }

        function summonUnit(type) {
            if (gameState !== 'PLAYING') return;
            
            if (type === 'rabbit' && rabbitCooldown > 0) return;
            if (type === 'lion' && lionCooldown > 0) return;

            const cost = type === 'rabbit' ? 1 : 2;
            if (foodCount >= cost) {
                selectedType = selectedType === type ? null : type;
                highlightSelectedButton();
            }
        }

        function highlightSelectedButton() {
            const btnRabbit = document.getElementById('btn-rabbit');
            const btnLion = document.getElementById('btn-lion');
            
            btnRabbit.style.border = 'none';
            btnLion.style.border = 'none';
            
            if (selectedType === 'rabbit') {
                btnRabbit.style.border = '3px solid #fff';
            } else if (selectedType === 'lion') {
                btnLion.style.border = '3px solid #fff';
            }
        }

        canvas.addEventListener('click', (e) => {
            if (gameState !== 'PLAYING' || !selectedType) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const r = Math.floor(y / ROW_HEIGHT);
            const boardStartX = 120;
            const c = Math.floor((x - boardStartX) / COL_WIDTH);

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                if (grid[r][c] === null) {
                    const cost = selectedType === 'rabbit' ? 1 : 2;
                    if (foodCount >= cost) {
                        foodCount -= cost;

                        // 觸發對應冷卻
                        if (selectedType === 'rabbit') {
                            rabbitCooldown = COOLDOWN_MAX;
                        } else {
                            lionCooldown = COOLDOWN_MAX;
                        }
                        
                        const unit = {
                            type: selectedType,
                            row: r,
                            col: c,
                            x: boardStartX + c * COL_WIDTH + COL_WIDTH / 2,
                            y: r * ROW_HEIGHT + ROW_HEIGHT / 2,
                            timer: 0
                        };

                        grid[r][c] = unit;
                        units.push(unit);
                        createParticles(unit.x, unit.y, '#FFEB3B', 10);

                        selectedType = null;
                        highlightSelectedButton();
                        updateUI();
                    }
                }
            }
        });

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 3 + 2,
                    color: color,
                    life: 30
                });
            }
        }

        function update() {
            if (gameState === 'PLAYING') {
                // 更新冷卻時間
                if (rabbitCooldown > 0) rabbitCooldown--;
                if (lionCooldown > 0) lionCooldown--;

                // 讀取選單設定的間隔時間 (秒數轉影格數：秒數 * 60)
                const rabbitIntervalSec = parseFloat(document.getElementById('select-rabbit-interval').value);
                const lionIntervalSec = parseFloat(document.getElementById('select-lion-interval').value);
                const rabbitFrames = Math.round(rabbitIntervalSec * 60);
                const lionFrames = Math.round(lionIntervalSec * 60);

                // 1. 處理猴子生成
                if (currentWaveSpawnLeft > 0) {
                    spawnCounter++;
                    const config = waveConfigs[currentWave - 1];
                    if (spawnCounter >= config.interval) {
                        spawnCounter = 0;
                        currentWaveSpawnLeft--;
                        spawnMonkey(config.speed);
                    }
                } else if (monkeys.length === 0 && currentWaveSpawnLeft === 0) {
                    if (currentWave < 10) {
                        gameState = 'WAVE_CLEAR';
                        wavePauseTimer = 120;
                        updateStatus(`第 ${currentWave} 回合防守成功！`);
                    } else {
                        gameState = 'VICTORY';
                        showOverlay('🎉 勝利！', '太棒了！你成功守住了動物園的美食，擊退了所有猴子大軍！');
                    }
                }

                // 2. 處理單位行為
                units.forEach(unit => {
                    unit.timer++;
                    const currentInterval = unit.type === 'rabbit' ? rabbitFrames : lionFrames;
                    
                    if (unit.timer >= currentInterval) {
                        unit.timer = 0;
                        if (unit.type === 'rabbit') {
                            foodCount++;
                            createParticles(unit.x, unit.y, '#8BC34A', 15);
                        } else if (unit.type === 'lion') {
                            projectiles.push({
                                x: unit.x + 20,
                                y: unit.y,
                                row: unit.row,
                                speed: 6,
                                damage: 1
                            });
                        }
                    }
                });

                // 3. 子彈與碰撞
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let proj = projectiles[i];
                    proj.x += proj.speed;

                    if (proj.x > canvas.width) {
                        projectiles.splice(i, 1);
                        continue;
                    }

                    for (let j = monkeys.length - 1; j >= 0; j--) {
                        let m = monkeys[j];
                        if (m.row === proj.row && Math.abs(proj.x - m.x) < 20) {
                            m.hp -= proj.damage;
                            createParticles(m.x, m.y, '#FF5722', 8);
                            projectiles.splice(i, 1);

                            if (m.hp <= 0) {
                                createParticles(m.x, m.y, '#795548', 20);
                                monkeys.splice(j, 1);
                            }
                            break;
                        }
                    }
                }

                // 4. 猴子移動與失敗判定
                for (let i = monkeys.length - 1; i >= 0; i--) {
                    let m = monkeys[i];
                    m.x -= m.speed;

                    if (m.x <= 60) {
                        gameState = 'GAMEOVER';
                        showOverlay('💥 遊戲失敗', '猴子突破防線搶走了食物！再接再厲！');
                        break;
                    }
                }
            } else if (gameState === 'WAVE_CLEAR') {
                wavePauseTimer--;
                if (wavePauseTimer <= 0) {
                    currentWave++;
                    gameState = 'PLAYING';
                    startWave(currentWave);
                }
            }

            // 5. 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            updateUI();
        }

        function spawnMonkey(speed) {
            const r = Math.floor(Math.random() * ROWS);
            const boardStartX = 120 + COLS * COL_WIDTH;
            monkeys.push({
                row: r,
                x: boardStartX + Math.random() * 50,
                y: r * ROW_HEIGHT + ROW_HEIGHT / 2,
                hp: 2,
                maxHp: 2,
                speed: speed
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const boardStartX = 120;
            
            ctx.fillStyle = '#d7ccc8';
            ctx.fillRect(0, 0, boardStartX, canvas.height);
            ctx.fillStyle = '#3e2723';
            ctx.font = 'bold 14px Microsoft JhengHei';
            ctx.textAlign = 'center';
            ctx.fillText('🍕 食物防線', boardStartX / 2, 30);

            for (let r = 0; r < ROWS; r++) {
                ctx.fillStyle = r % 2 === 0 ? '#388e3c' : '#2e7d32';
                ctx.fillRect(boardStartX, r * ROW_HEIGHT, canvas.width - boardStartX, ROW_HEIGHT);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(boardStartX, r * ROW_HEIGHT);
                ctx.lineTo(canvas.width, r * ROW_HEIGHT);
                ctx.stroke();

                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🍕', boardStartX / 2, r * ROW_HEIGHT + ROW_HEIGHT / 2);
            }

            for (let c = 0; c <= COLS; c++) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.moveTo(boardStartX + c * COL_WIDTH, 0);
                ctx.lineTo(boardStartX + c * COL_WIDTH, canvas.height);
                ctx.stroke();
            }

            units.forEach(u => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.arc(u.x, u.y + 15, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(u.type === 'rabbit' ? '🐰' : '🦁', u.x, u.y);

                // 進度條
                const rabbitIntervalSec = parseFloat(document.getElementById('select-rabbit-interval').value);
                const lionIntervalSec = parseFloat(document.getElementById('select-lion-interval').value);
                const maxIntervalFrames = (u.type === 'rabbit' ? rabbitIntervalSec : lionIntervalSec) * 60;

                const barWidth = 40, barHeight = 4;
                const progress = Math.min(1, u.timer / maxIntervalFrames);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(u.x - barWidth / 2, u.y - 28, barWidth, barHeight);
                ctx.fillStyle = u.type === 'rabbit' ? '#8BC34A' : '#FF9800';
                ctx.fillRect(u.x - barWidth / 2, u.y - 28, barWidth * progress, barHeight);
            });

            monkeys.forEach(m => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.beginPath();
                ctx.arc(m.x, m.y + 15, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐵', m.x, m.y);

                const barWidth = 35, barHeight = 5;
                const hpRatio = m.hp / m.maxHp;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(m.x - barWidth / 2, m.y - 26, barWidth, barHeight);
                ctx.fillStyle = '#f44336';
                ctx.fillRect(m.x - barWidth / 2, m.y - 26, barWidth * hpRatio, barHeight);
            });

            projectiles.forEach(p => {
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🍌', p.x, p.y);
            });

            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateUI() {
            document.getElementById('ui-wave').innerText = currentWave;
            document.getElementById('ui-food').innerText = foodCount;

            const btnRabbit = document.getElementById('btn-rabbit');
            const btnLion = document.getElementById('btn-lion');

            // 檢查冷卻與資源狀態
            const rabbitCanAfford = foodCount >= 1 && rabbitCooldown === 0 && gameState === 'PLAYING';
            const lionCanAfford = foodCount >= 2 && lionCooldown === 0 && gameState === 'PLAYING';

            btnRabbit.disabled = !rabbitCanAfford;
            btnLion.disabled = !lionCanAfford;

            // 更新冷卻遮罩高度
            const cdRabbitPercent = (rabbitCooldown / COOLDOWN_MAX) * 100;
            const cdLionPercent = (lionCooldown / COOLDOWN_MAX) * 100;
            document.getElementById('cd-rabbit').style.height = cdRabbitPercent + '%';
            document.getElementById('cd-lion').style.height = cdLionPercent + '%';

            if (selectedType === 'rabbit' && !rabbitCanAfford) {
                selectedType = null;
                highlightSelectedButton();
            }
            if (selectedType === 'lion' && !lionCanAfford) {
                selectedType = null;
                highlightSelectedButton();
            }
        }

        function updateStatus(text) {
            document.getElementById('ui-status').innerText = text;
        }

        function showOverlay(title, desc) {
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerHTML = desc;
            document.getElementById('overlay-btn').innerText = '重新開始';
            overlay.classList.remove('hidden');
        }

        function mainLoop() {
            update();
            draw();
            requestAnimationFrame(mainLoop);
        }

        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
